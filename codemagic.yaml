workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter build
        script: |
          flutter pub get
          flutter build ipa --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
